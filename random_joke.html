<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Joke Generator</title>
</head>

<body>
  <h2>Joke of the Moment</h2>
  <div id="joke"></div>
  <br />
  <input type="button" value="Get Another Joke" id="btn" />

  <script>
    const jokeDiv = document.getElementById("joke");
    const btn = document.getElementById("btn");

    function fetchJoke() {
      fetch("https://official-joke-api.appspot.com/jokes/random")
        .then(response => response.json())
        .then(data => {
          jokeDiv.innerHTML = `${data.setup}<br><strong>${data.punchline}</strong>`;
        })
        .catch(error => {
          jokeDiv.innerHTML = "Failed to fetch a joke.";
          console.error(error);
        });
    }

    // Fetch a joke when the page loads
    fetchJoke();

    // Fetch a new joke on button click
    btn.addEventListener("click", fetchJoke);
  </script>
</body>

</html>
