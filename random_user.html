<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let p = fetch(`https://randomuser.me/api/`).then(Response => Response.json()).then(data => {

            const user = data.results[0];
            document.writeln(`<strong>Name:</strong> ${user.name.title} ${user.name.first} ${user.name.last} <br>`);
            document.writeln(`<strong>Gender:</strong>${user.gender}<br>`);
            document.writeln(`<strong>Email:</strong>${user.email}<br>`);
            document.writeln(`<strong>Age:</strong>${user.dob.age}<br>`);
            document.writeln(`<strong>Picture:</strong> <img src="${user.picture.medium}" alt="User Picture"><br>`);


        })
    </script>
</body>

</html>
