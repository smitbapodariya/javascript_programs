<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Finder Game</title>
    <style>
        /* Center everything */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
        }

        /* Image Styling */
        img {
            width: 300px;
            height: auto;
            border-radius: 10px;
            display: block;
            margin: 10px auto;
        }

        /* Centering the radio button group */
        .radio-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            /* Adds space between buttons */
            margin-top: 10px;
        }

        /* Hide default radio button */
        input[type="radio"] {
            display: none;
        }

        /* Styling the labels as buttons */
        label {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        /* Highlight the selected button */
        input[type="radio"]:checked+label {
            background-color: #2ecc71;
        }

        #div2,
        #div3,
        #div4,
        #div5,
        #div6,
        #div7 {
            display: none;
        }

        /* Style the Next button */
        #btnnxt {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }

        /* Hover effect */
        #btnnxt:hover {
            background-color: #c0392b;
        }

        /* Center the button */
        #btnnxt {
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
